version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/admin.sql
    gen:
      go:
        package: admindb
        out: internal/modules/admin/db
        sql_package: pgx/v5
        emit_empty_slices: true
        omit_unused_structs: true
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/catalogos_clasificacion.sql
    gen:
      go:
        package: catalogdb
        out: internal/modules/catalogos/db
        sql_package: pgx/v5
        emit_empty_slices: true
        omit_unused_structs: true
