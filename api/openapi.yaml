        - $ref: '#/components/parameters/PageSize'
        - name: municipio_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Página de lugares canónicos. Un filtro sin coincidencias devuelve una lista vacía.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListarLugaresTerritoriales'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/CatalogoNoDisponible'
  /api/v1/catalogos/tipos-proyecto:
    get:
      operationId: listarTiposProyecto
      summary: Listar tipos de proyecto
      security:
        - AdminCookie: []
      description: Activos por defecto. Orden ascendente por nombre e ID.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/BusquedaClasificacion'
        - $ref: '#/components/parameters/IncluirInactivosClasificacion'
      responses:
        '200':
          $ref: '#/components/responses/PaginaClasificacion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/CatalogoNoDisponible'
    post:
      operationId: crearTipoProyecto
      summary: Crear tipo de proyecto
      security:
        - AdminCookie: []
          CSRFHeader: []
      requestBody:
        $ref: '#/components/requestBodies/NombreClasificacion'
      responses:
        '201':
          $ref: '#/components/responses/OpcionClasificacionCreada'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/CatalogoNoDisponible'
  /api/v1/catalogos/tipos-proyecto/{id}:
    parameters:
      - $ref: '#/components/parameters/UUIDClasificacion'
    get:
      operationId: consultarTipoProyecto
      summary: Consultar tipo de proyecto
      security:
        - AdminCookie: []
      responses:
        '200':
          $ref: '#/components/responses/OpcionClasificacion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/CatalogoNoDisponible'
    patch:
      operationId: editarTipoProyecto
      summary: Editar nombre de tipo de proyecto
      security:
        - AdminCookie: []
          CSRFHeader: []
      requestBody:
        $ref: '#/components/requestBodies/NombreClasificacion'
      responses:
        '200':
          $ref: '#/components/responses/OpcionClasificacion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/CatalogoNoDisponible'
  /api/v1/catalogos/tipos-proyecto/{id}/desactivar:
    parameters:
      - $ref: '#/components/parameters/UUIDClasificacion'
    post:
      operationId: desactivarTipoProyecto
      summary: Desactivar tipo de proyecto
      security:
        - AdminCookie: []
          CSRFHeader: []
      responses:
        '200':
          $ref: '#/components/responses/OpcionClasificacion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/CatalogoNoDisponible'
  /api/v1/catalogos/areas:
