      responses:
        '200':
          description: Listado del core y metadatos de paginación.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListarCarreras'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/CatalogoNoDisponible'
  /api/v1/catalogos/carreras/{id}:
    get:
      operationId: consultarCarrera
      summary: Consultar una carrera del core
      description: Incluye carreras inactivas y carreras de facultades inactivas para consultar referencias históricas.
      security:
        - AdminCookie: []
      parameters:
        - $ref: '#/components/parameters/UUIDCatalogo'
      responses:
        '200':
          description: Registro del catálogo académico del core.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carrera'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/CatalogoNoDisponible'
  /api/health/live:
    get:
      operationId: getLiveness
      summary: Comprobar el proceso HTTP sin depender de PostgreSQL
      responses:
        '200':
          description: Proceso disponible
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOK'
        '500':
          $ref: '#/components/responses/LegacyInternalError'
  /api/health/ready:
    get:
      operationId: getReadiness
      summary: Comprobar conexión PostgreSQL con plazo máximo de dos segundos
      description: No comprueba tablas ni versión de migración. Respeta cancelación del cliente.
      responses:
        '200':
          description: PostgreSQL disponible
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOK'
        '503':
          description: PostgreSQL no disponible
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    const: unavailable
        '500':
          $ref: '#/components/responses/LegacyInternalError'
  /api/v1/catalogos/departamentos:
    get:
      operationId: listarDepartamentos
      summary: Listar departamentos
      description: Lista los departamentos del catálogo canónico. Orden por código e ID.
      security:
        - AdminCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de lugares canónicos. Un filtro sin coincidencias devuelve una lista vacía.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListarLugaresTerritoriales'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/CatalogoNoDisponible'
  /api/v1/catalogos/municipios:
    get:
      operationId: listarMunicipios
      summary: Listar municipios
      description: Lista los municipios vinculados al departamento indicado. Orden por código e ID.
      security:
        - AdminCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: departamento_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Página de lugares canónicos. Un filtro sin coincidencias devuelve una lista vacía.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
