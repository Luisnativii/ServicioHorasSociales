openapi: 3.1.0
info:
  title: Portal de Horas Sociales
  version: 0.0.1
  description: |
    Revisión inicial del contrato HTTP, independiente de la versión de la aplicación.
    Las rutas de salud y preparación CSRF están implementadas y son públicas.
    Las demás rutas del grupo /api/v1 exigen una cookie JWT válida; sus mutaciones
    exigen Origin y prueba CSRF firmada ligada al JWT. Las rutas de inicio de sesión y cierre de sesión ya están implementadas.
    Todas las respuestas JSON usan Cache-Control no-store y X-Request-ID.
paths:
  /api/v1/auth/csrf:
    get:
      operationId: prepareCSRF
      summary: Preparar cookie CSRF antes del login o para el JWT vigente
      description: |
        Devuelve solo la cookie legible hs_csrf, nunca el JWT en JSON.
        Copiar su valor a X-CSRF-Token en mutaciones, junto con Origin exacto.
        Sin JWT válido prepara una prueba de prelogin; con JWT válido la liga
        a ese token. No renueva el acceso. Tras expirar, volver a preparar la
        prueba antes del futuro logout. No habilita CORS con credenciales.
      security: []
      responses:
        '204':
          description: Cookie preparada; cuerpo vacío y Cache-Control no-store.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: hs_csrf; Path=/; SameSite=Strict; Max-Age=7200; Secure con HTTPS; sin Domain ni HttpOnly.
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '403':
          description: Origen/Host no permitido o cookies ambiguas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Clave u origen no configurados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/login:
    post:
      operationId: postLogin
      summary: Iniciar sesión de administrador con cookie de acceso
      description: |
        Valida correo y contraseña con Argon2id sin revelar si la cuenta existe.
        Al autenticar emite hs_access (JWT de dos horas, HttpOnly) y rota hs_csrf.
        Ningún token viaja en el cuerpo. Requiere Origin exacto y prueba CSRF
        firmada; exceder el límite de intentos devuelve 429 con Retry-After.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [correo, contrasena]
              properties:
                correo:
                  type: string
                  format: email
                  description: Correo canónico de la cuenta de administrador.
                contrasena:
                  type: string
                  minLength: 6
                  maxLength: 128
                  description: Contraseña sin verificar; nunca se devuelve.
      responses:
        '200':
          description: Sesión iniciada; cookies hs_access y hs_csrf emitidas.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: hs_access (Path=/api, HttpOnly, Secure con HTTPS) y hs_csrf (Path=/).
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identidad'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/logout:
    post:
      operationId: postLogout
      summary: Cerrar sesión eliminando cookies del navegador
      description: |
        Exige Origin exacto y prueba CSRF firmada, pero no un JWT vigente:
        permite cerrar incluso cuando el token ya venció, siempre que se haya
        preparado CSRF con antelación. Borra hs_access y hs_csrf con los mismos
        atributos de emisión (HttpOnly, SameSite=Strict, Secure con HTTPS).
        No invalida el JWT en servidor: una copia previa conserva validez hasta
        vencer. No hay cierre remoto, revocación ni tabla de sesiones.
      security: []
      responses:
        '204':
          description: Cookies eliminadas; cuerpo vacío y Cache-Control no-store.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: hs_access y hs_csrf borradas con Max-Age=0 y Expires en el pasado; Path=/api y Path=/ respectivamente; SameSite=Strict.
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/me:
    get:
      operationId: getMe
      summary: Consultar la identidad de la sesión vigente
      description: |
        Devuelve id y correo del actor autenticado por la cookie hs_access.
        Consultar la identidad no extiende el vencimiento de dos horas y no
        revoca nada.
      security:
        - AdminCookie: []
      responses:
        '200':
          description: Identidad del actor de la sesión.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identidad'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/cuentas:
    get:
      operationId: listarCuentas
      summary: Listar cuentas de administrador con paginación
      description: |
        Devuelve las cuentas de administrador con su estado activo/inactivo.
        No devuelve hashes de contraseña. Requiere JWT válido; no exige CSRF
        porque es una consulta de solo lectura.
      security:
        - AdminCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Listado de cuentas con metadatos de paginación.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListarCuentas'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/cuentas/{id}/activar:
    post:
      operationId: activarCuenta
      summary: Activar una cuenta de administrador
      description: |
        Activa una cuenta de administrador existente. Requiere JWT, Origin
        exacto y prueba CSRF firmada. Desactivar la última cuenta activa o la
        propia cuenta está permitido; no hay revocación de JWT emitidos.
      security:
        - AdminCookie: []
          CSRFHeader: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador de la cuenta de administrador.
      responses:
        '200':
          description: Cuenta activada.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cuenta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/cuentas/{id}/desactivar:
    post:
      operationId: desactivarCuenta
      summary: Desactivar una cuenta de administrador
      description: |
        Desactiva una cuenta de administrador existente. Una cuenta desactivada
        no puede iniciar sesión, pero sus JWT emitidos conservan validez hasta
        vencer. Requiere JWT, Origin exacto y prueba CSRF firmada.
      security:
        - AdminCookie: []
          CSRFHeader: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador de la cuenta de administrador.
      responses:
        '200':
          description: Cuenta desactivada.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cuenta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/health/live:
    get:
      operationId: getLiveness
      summary: Comprobar el proceso HTTP sin depender de PostgreSQL
      responses:
        '200':
          description: Proceso disponible
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOK'
        '500':
          $ref: '#/components/responses/LegacyInternalError'
  /api/health/ready:
    get:
      operationId: getReadiness
      summary: Comprobar conexión PostgreSQL con plazo máximo de dos segundos
      description: No comprueba tablas ni versión de migración. Respeta cancelación del cliente.
      responses:
        '200':
          description: PostgreSQL disponible
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOK'
        '503':
          description: PostgreSQL no disponible
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    const: unavailable
        '500':
          $ref: '#/components/responses/LegacyInternalError'
components:
  securitySchemes:
    CSRFHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Debe coincidir con hs_csrf y tener firma válida ligada al JWT para mutaciones autenticadas. Origin exacto también es obligatorio.
    AdminCookie:
      type: apiKey
      in: cookie
      name: hs_access
      description: JWT HS256 de dos horas, validado por el grupo privado /api/v1. Sin emisión web todavía.
  headers:
    RequestID:
      description: Identificador de correlación de la petición
      schema:
        type: string
  schemas:
    Identidad:
      type: object
      additionalProperties: false
      required: [id, correo]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador de la cuenta de administrador (sub del JWT).
        correo:
          type: string
          format: email
          description: Correo canónico de la cuenta autenticada.
    Cuenta:
      type: object
      additionalProperties: false
      required: [id, correo, activo]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador de la cuenta de administrador.
        correo:
          type: string
          format: email
          description: Correo canónico de la cuenta de administrador.
        activo:
          type: boolean
          description: Indica si la cuenta puede iniciar sesión.
    ListarCuentas:
      type: object
      additionalProperties: false
      required: [cuentas, pagina]
      properties:
        cuentas:
          type: array
          items:
            $ref: '#/components/schemas/Cuenta'
        pagina:
          $ref: '#/components/schemas/PageMetadata'
    HealthOK:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: ok
    LegacyError:
      description: Rutas fuera de /api/v1 conservan el formato inicial.
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [not_found, method_not_allowed, error]
    Error:
      description: |
        Formato común de /api/v1. Los errores no exponen mensajes originales,
        SQL, credenciales ni trazas. Una ruta /api/v1 desconocida ya usa este formato.
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              enum: [invalid_json, invalid_pagination, bad_request, unauthorized, forbidden, not_found, method_not_allowed, conflict, too_many_requests, payload_too_large, unsupported_media_type, internal_error, service_unavailable]
            message:
              type: string
            request_id:
              type: string
    PageMetadata:
      description: Esquema reutilizable para listados futuros; no existe un endpoint de listado todavía.
      type: object
      additionalProperties: false
      required: [page, page_size, total]
      properties:
        page:
          type: integer
          format: int64
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
  parameters:
    Page:
      name: page
      in: query
      description: Una sola ocurrencia; el offset calculado debe caber en int64.
      schema:
        type: integer
        format: int64
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      description: Una sola ocurrencia; valores vacíos o fuera de rango se rechazan.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Sort:
      name: sort
      in: query
      description: Nombre público de la lista permitida por el módulo; nunca SQL recibido del cliente.
      schema:
        type: string
        minLength: 1
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc
  responses:
    LegacyInternalError:
      description: Error interno genérico en salud
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    BadRequest:
      description: 400; JSON inválido, campos desconocidos o parámetros fuera de rango
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 401; credenciales ausentes, inválidas, vencidas o cuenta inexistente/inactiva, sin revelar cuál
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: 429; límite de intentos de inicio de sesión excedido
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 0
          description: Segundos restantes antes de reintentar.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 403; operación no permitida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 404; recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowed:
      description: 405; método no permitido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 409; conflicto con el estado actual
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: 413; cuerpo superior a 1 MiB (incluido espacio al final)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: 415; se requiere application/json, con charset opcional
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: 500; error interno genérico
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
