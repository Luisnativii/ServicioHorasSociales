      summary: Buscar expedientes por nombre o carnet
      security:
        - AdminCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          schema: {type: string, maxLength: 100}
        - name: facultad_id
          in: query
          schema: {type: string, format: uuid}
        - name: carrera_id
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Expedientes ordenados por nombre e ID.
          content:
            application/json:
              schema:
                type: object
                required: [estudiantes, pagina]
                properties:
                  estudiantes:
                    type: array
                    items: {$ref: '#/components/schemas/Estudiante'}
                  pagina:
                    type: object
                    required: [page, page_size, total]
                    properties:
                      page: {type: integer, minimum: 1}
                      page_size: {type: integer, minimum: 1, maximum: 100}
                      total: {type: integer, minimum: 0}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {description: Base de datos no disponible.}
    post:
      operationId: crearEstudiante
      summary: Crear un expediente
      security:
        - AdminCookie: []
          CSRFHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/DatosEstudiante'
                - required: [nombres, apellidos]
                  properties:
                    nombres: {type: string}
                    apellidos: {type: string}
      responses:
        '201':
          description: Expediente creado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Estudiante'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '503': {description: Base de datos o historial académico no disponible.}
  /api/v1/estudiantes/{id}:
    parameters:
      - $ref: '#/components/parameters/UUIDCatalogo'
    get:
      operationId: consultarEstudiante
      summary: Consultar expediente e historial académico
      security:
        - AdminCookie: []
      responses:
        '200':
          description: Expediente y vigencias registradas.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Estudiante'
                  - type: object
                    required: [historial_disponible, vigencias]
                    properties:
                      historial_disponible: {type: boolean}
                      vigencias:
                        type: array
                        items:
                          type: object
                          required: [carrera, facultad, desde, hasta, motivo]
                          properties:
                            carrera: {$ref: '#/components/schemas/ReferenciaAcademica'}
                            facultad: {$ref: '#/components/schemas/ReferenciaAcademica'}
                            desde: {type: [string, 'null'], format: date-time, description: Nulo si se desconoce.}
                            hasta: {type: [string, 'null'], format: date-time, description: Nulo para la vigencia abierta.}
                            motivo: {type: [string, 'null']}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {description: Base de datos no disponible.}
    put:
      operationId: editarEstudiante
      summary: Actualizar un expediente y registrar el cambio de carrera si corresponde
      security:
        - AdminCookie: []
          CSRFHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DatosEstudiante'}
      responses:
        '200':
          description: Expediente actualizado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Estudiante'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '503': {description: Base de datos o historial académico no disponible.}
components:
  securitySchemes:
    CSRFHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Debe coincidir con hs_csrf y tener firma válida ligada al JWT para mutaciones autenticadas. Origin exacto también es obligatorio.
    AdminCookie:
      type: apiKey
      in: cookie
      name: hs_access
      description: JWT HS256 de dos horas, validado por el grupo privado /api/v1. Sin emisión web todavía.
  headers:
    RequestID:
      description: Identificador de correlación de la petición
      schema:
        type: string
  requestBodies:
    DatosProyecto:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [titulo, institucion_id, distrito_id, tipo_id, area_id, modalidad_id, responsable]
            properties:
              titulo: {type: string, minLength: 1, maxLength: 300}
              descripcion: {type: string, maxLength: 10000}
              institucion_id: {type: string, format: uuid}
              distrito_id: {type: string, format: uuid}
              tipo_id: {type: string, format: uuid}
              area_id: {type: string, format: uuid}
              modalidad_id: {type: string, format: uuid}
              naturaleza: {type: string, enum: [EXTERNA, INTERNA], default: EXTERNA}
              fecha_inicio: {type: [string, 'null'], format: date}
              cupo: {type: [integer, 'null'], minimum: 1, maximum: 2147483647}
              responsable:
                type: object
                additionalProperties: false
                required: [nombre]
                properties:
                  nombre: {type: string, minLength: 1, maxLength: 200}
                  correo: {type: [string, 'null'], format: email}
                  telefono: {type: [string, 'null']}
                  extension: {type: [string, 'null']}
    DatosInstitucion:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [nombre]
            properties:
              nombre:
                type: string
                minLength: 1
                description: Nombre único de hasta 200 caracteres después de recortar espacios exteriores.
              distrito_id:
                type: [string, 'null']
                format: uuid
                description: UUID del distrito canónico de la sede. Omitirlo o enviar null deja la institución sin sede canónica.
              contacto:
                description: Bloque opcional. Si se omite o es null durante la edición, se conserva el contacto existente.
                anyOf:
                  - type: object
                    additionalProperties: false
                    required: [nombre]
                    properties:
                      nombre:
                        type: string
                        minLength: 1
                        maxLength: 200
                      correo:
                        type: [string, 'null']
                        format: email
                      telefono:
                        type: [string, 'null']
                        minLength: 8
                        maxLength: 20
                      extension:
                        type: [string, 'null']
                        maxLength: 200
                        description: Requiere teléfono. Se conserva como texto.
                  - type: 'null'
    NombreClasificacion:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [nombre]
            properties:
              nombre:
                type: string
                minLength: 1
                description: Nombre de hasta 200 caracteres después de recortar espacios exteriores.
  schemas:
    ReferenciaAcademica:
      type: object
      required: [id, nombre]
      properties:
        id: {type: string, format: uuid}
        nombre: {type: string}
    Estudiante:
      type: object
      required: [id, carnet, nombres, apellidos, nombre_completo, correo_institucional, carrera, facultad, activo]
      properties:
        id: {type: string, format: uuid}
        carnet: {type: string, pattern: '^[0-9]{8}$'}
        nombres: {type: [string, 'null']}
        apellidos: {type: [string, 'null']}
        nombre_completo: {type: string}
        correo_institucional: {type: string, format: email}
        carrera: {$ref: '#/components/schemas/ReferenciaAcademica'}
        facultad: {$ref: '#/components/schemas/ReferenciaAcademica'}
        activo: {type: boolean}
    DatosEstudiante:
      type: object
      additionalProperties: false
      required: [carnet, correo_institucional, carrera_id]
      properties:
        carnet: {type: string, pattern: '^[0-9]{8}$'}
        nombres: {type: [string, 'null'], minLength: 1, maxLength: 120}
        apellidos: {type: [string, 'null'], minLength: 1, maxLength: 120}
        correo_institucional: {type: string, format: email, pattern: '@uca\.edu\.sv$'}
        carrera_id: {type: string, format: uuid}
        motivo_cambio_carrera: {type: string, maxLength: 500, description: Obligatorio al cambiar de carrera.}
    Institucion:
      type: object
      additionalProperties: false
      required: [id, nombre, codigo_css, activo, sede, ubicacion_heredada, contacto]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        codigo_css:
          type: [string, 'null']
        activo:
          type: boolean
        sede:
          type: [object, 'null']
          additionalProperties: false
          required: [distrito_id, nombre]
          properties:
            distrito_id:
              type: string
              format: uuid
            nombre:
              type: string
        ubicacion_heredada:
          type: [string, 'null']
        contacto:
          type: [object, 'null']
          additionalProperties: false
          required: [nombre, correo, telefono, extension]
          properties:
            nombre:
              type: [string, 'null']
            correo:
              type: [string, 'null']
            telefono:
              type: [string, 'null']
            extension:
              type: [string, 'null']
    PaginaInstituciones:
      type: object
      additionalProperties: false
      required: [instituciones, pagina]
      properties:
        instituciones:
          type: array
          items:
            $ref: '#/components/schemas/Institucion'
        pagina:
          $ref: '#/components/schemas/PageMetadata'
    OpcionClasificacion:
      type: object
      additionalProperties: false
      required: [id, nombre, activo]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        activo:
          type: boolean
    PaginaClasificacion:
      type: object
      additionalProperties: false
      required: [opciones, pagina]
      properties:
        opciones:
          type: array
          items:
            $ref: '#/components/schemas/OpcionClasificacion'
        pagina:
          $ref: '#/components/schemas/PageMetadata'
    LugarTerritorial:
      type: object
      additionalProperties: false
      required: [id, codigo, nombre]
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
        nombre:
          type: string
        padre_id:
          type: string
          format: uuid
          description: UUID del departamento para municipios y del municipio para distritos. Se omite en departamentos.
    ListarLugaresTerritoriales:
      type: object
      additionalProperties: false
      required: [lugares, pagina]
      properties:
        lugares:
          type: array
          items:
            $ref: '#/components/schemas/LugarTerritorial'
        pagina:
          $ref: '#/components/schemas/PageMetadata'
    Identidad:
      type: object
      additionalProperties: false
      required: [id, correo]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador de la cuenta de administrador (sub del JWT).
        correo:
          type: string
          format: email
          description: Correo canónico de la cuenta autenticada.
    Cuenta:
      type: object
      additionalProperties: false
      required: [id, correo, activo]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador de la cuenta de administrador.
        correo:
          type: string
          format: email
          description: Correo canónico de la cuenta de administrador.
        activo:
          type: boolean
          description: Indica si la cuenta puede iniciar sesión.
    ListarCuentas:
      type: object
      additionalProperties: false
      required: [cuentas, pagina]
      properties:
        cuentas:
          type: array
          items:
            $ref: '#/components/schemas/Cuenta'
        pagina:
          $ref: '#/components/schemas/PageMetadata'
    Facultad:
      type: object
      additionalProperties: false
      required: [id, nombre, activo]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        activo:
          type: boolean
    Carrera:
      type: object
      additionalProperties: false
      required: [id, facultad_id, nombre, activo, facultad_activa]
      properties:
        id:
          type: string
          format: uuid
        facultad_id:
          type: string
          format: uuid
          description: UUID de la facultad propietaria en el core.
        nombre:
          type: string
        activo:
          type: boolean
        facultad_activa:
          type: boolean
          description: Para nuevas altas deben estar activas tanto la carrera como su facultad.
    ListarFacultades:
      type: object
      additionalProperties: false
      required: [facultades, pagina]
      properties:
        facultades:
          type: array
          items:
            $ref: '#/components/schemas/Facultad'
        pagina:
          $ref: '#/components/schemas/PageMetadata'
    ListarCarreras:
      type: object
      additionalProperties: false
      required: [carreras, pagina]
      properties:
        carreras:
          type: array
          items:
            $ref: '#/components/schemas/Carrera'
        pagina:
          $ref: '#/components/schemas/PageMetadata'
    HealthOK:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: ok
    LegacyError:
      description: Rutas fuera de /api/v1 conservan el formato inicial.
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [not_found, method_not_allowed, error]
    Error:
      description: |
        Formato común de /api/v1. Los errores no exponen mensajes originales,
        SQL, credenciales ni trazas. Una ruta /api/v1 desconocida ya usa este formato.
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              enum: [invalid_json, invalid_pagination, bad_request, unauthorized, forbidden, not_found, method_not_allowed, conflict, too_many_requests, payload_too_large, unsupported_media_type, internal_error, service_unavailable]
            message:
              type: string
            request_id:
              type: string
            field:
              type: string
              description: Campo de la solicitud al que corresponde el error, si aplica.
    PageMetadata:
      description: Metadatos del listado. Total cuenta los registros que coinciden con los filtros antes de paginar.
      type: object
      additionalProperties: false
      required: [page, page_size, total]
      properties:
        page:
          type: integer
          format: int64
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
  parameters:
    BusquedaInstitucion:
      name: q
      in: query
      description: Fragmento literal del nombre o código CSS, sin distinguir mayúsculas.
      schema:
        type: string
        maxLength: 200
    UUIDClasificacion:
      name: id
      in: path
      required: true
      description: UUID de la opción del portal distinto de cero.
      schema:
        type: string
        format: uuid
    BusquedaClasificacion:
      name: q
      in: query
      description: Fragmento literal del nombre sin distinguir mayúsculas. Vacío equivale a omitir el filtro.
      schema:
        type: string
        maxLength: 200
    IncluirInactivosClasificacion:
      name: incluir_inactivos
      in: query
      schema:
        type: boolean
        default: false
    UUIDCatalogo:
      name: id
      in: path
      required: true
      description: UUID del core distinto de cero.
      schema:
        type: string
        format: uuid
    BusquedaAcademica:
      name: q
      in: query
      description: Fragmento del nombre. La búsqueda ignora mayúsculas y tildes. Vacío equivale a omitir el filtro.
      schema:
        type: string
    IncluirInactivas:
      name: incluir_inactivas
      in: query
      description: Indica si el listado incluye opciones inactivas para consulta histórica.
      schema:
        type: boolean
        default: false
    FacultadID:
      name: facultad_id
      in: query
      description: Restringe las carreras a una facultad del core.
      schema:
        type: string
        format: uuid
    OrdenAcademico:
      name: sort
      in: query
      schema:
        type: string
        const: nombre
    DireccionAcademica:
      name: order
      in: query
      schema:
        type: string
        const: asc
    Page:
      name: page
      in: query
      description: Una sola ocurrencia; el offset calculado debe caber en int64.
      schema:
        type: integer
        format: int64
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      description: Una sola ocurrencia; valores vacíos o fuera de rango se rechazan.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Sort:
      name: sort
      in: query
      description: Nombre público de la lista permitida por el módulo; nunca SQL recibido del cliente.
      schema:
        type: string
        minLength: 1
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc
  responses:
    Institucion:
      description: Institución vigente o histórica del core.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Institucion'
    InstitucionCreada:
      description: Institución creada como activa.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Institucion'
    PaginaInstituciones:
      description: Instituciones y metadatos de paginación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaginaInstituciones'
    InstitucionesNoDisponible:
      description: La API no pudo operar sobre las instituciones del core.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CoordinadorCarrera:
      description: Nombre opcional de coordinador guardado por el portal.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [carrera_id, coordinador_nombre]
            properties:
              carrera_id:
                type: string
                format: uuid
              coordinador_nombre:
                type: [string, 'null']
    OpcionClasificacion:
      description: Opción vigente o histórica del catálogo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpcionClasificacion'
    OpcionClasificacionCreada:
      description: Opción creada como activa.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpcionClasificacion'
    PaginaClasificacion:
      description: Opciones del catálogo y metadatos de paginación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaginaClasificacion'
    CatalogoNoDisponible:
      description: 503 cuando la API no puede operar sobre el catálogo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    LegacyInternalError:
      description: Error interno genérico en salud
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    BadRequest:
      description: 400; JSON inválido, campos desconocidos o parámetros fuera de rango
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 401; credenciales ausentes, inválidas, vencidas o cuenta inexistente/inactiva, sin revelar cuál
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: 429; límite de intentos de inicio de sesión excedido
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 0
          description: Segundos restantes antes de reintentar.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 403; operación no permitida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 404; recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowed:
      description: 405; método no permitido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 409; conflicto con el estado actual
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: 413; cuerpo superior a 1 MiB (incluido espacio al final)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: 415; se requiere application/json, con charset opcional
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: 500; error interno genérico
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
