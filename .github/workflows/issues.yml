name: Issues

on:
  issues:
    types: [labeled, closed, reopened]

permissions:
  contents: read

concurrency:
  group: issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  branch:
    name: Rama del issue
    if: github.event.action != 'labeled' || github.event.label.name == 'status:ready'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false
      - name: Gestionar rama y estado
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { manageIssue } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/gitflow.cjs`);
            await manageIssue({ github, context, core });
