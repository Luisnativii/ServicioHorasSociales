name: hs-test-runtime
services:
  api:
    image: hs-api:${APP_VERSION:-0.0.1}-runtime-check
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
      args: {APP_VERSION: "${APP_VERSION:-0.0.1}"}
      target: runtime
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      DB_MAX_CONNS: '2'
    networks: [app, data]
    healthcheck:
      test: [CMD, /api, healthcheck]
      interval: 2s
      timeout: 4s
      retries: 20
    stop_grace_period: 15s
  web:
    image: hs-web:${APP_VERSION:-0.0.1}-runtime-check
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
      args: {APP_VERSION: "${APP_VERSION:-0.0.1}"}
      target: runtime
    depends_on:
      api: {condition: service_healthy}
    networks: [app]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/]
      interval: 2s
      timeout: 3s
      retries: 20
networks:
  app: {}
  data:
    external: true
    name: hs-test_data
