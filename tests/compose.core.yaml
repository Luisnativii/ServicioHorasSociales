x-core-api: &core-api
  image: hs-api:${APP_VERSION:-0.0.1}-test-core
  build:
    context: .
    dockerfile: deploy/docker/api.Dockerfile
    target: runtime
    args: {APP_VERSION: "${APP_VERSION:-0.0.1}"}
  networks: [data]

x-core-env: &core-env
  CHECK_CORE_CATALOG: "true"
  DB_MAX_CONNS: "2"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/core-local/init-db.sh:/docker-entrypoint-initdb.d/10-core.sh:ro
      - ./deploy/core-local/migrations:/opt/core-migrations:ro
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -q -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 40

  api:
    <<: *core-api
    environment:
      <<: *core-env
      DATABASE_URL: postgres://hs_core_probe:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable

  api-missing:
    <<: *core-api
    environment:
      <<: *core-env
      DATABASE_URL: postgres://hs_core_probe:${POSTGRES_PASSWORD}@db:5432/postgres?sslmode=disable

  catalogo-test:
    profiles: [tools]
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
      target: dev
    networks: [data]
    environment:
      HS_TEST_CORE_CATALOG: "1"
      DATABASE_URL: postgres://hs_core_probe:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    command: [go, test, -count=1, -run, '^Test(CatalogoAcademico|CatalogoTerritorial|CoordinadorCarrera|Instituciones|InstitucionesAPI|EstudiantesAPI|ProyectosAPI|ParticipacionesAPI|CierresAPI)PostgreSQL$', ./internal/platform/http, ./internal/modules/instituciones]

  probe:
    image: node:22.23.4-bookworm-slim
    profiles: [tools]
    networks: [data]
    volumes:
      - ./tests/check-core-readiness.cjs:/probe/check.cjs:ro
    entrypoint: [node, /probe/check.cjs]
    command: []

networks:
  data: {internal: true}
volumes:
  pgdata: {}
