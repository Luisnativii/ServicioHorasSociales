x-core-api: &core-api
  image: hs-api:${APP_VERSION:-0.0.1}-test-core
  build:
    context: .
    dockerfile: deploy/docker/api.Dockerfile
    target: runtime
    args: {APP_VERSION: "${APP_VERSION:-0.0.1}"}
  networks: [data]

x-core-env: &core-env
  CHECK_CORE_CATALOG: "true"
  DB_MAX_CONNS: "2"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/core-local/init-db.sh:/docker-entrypoint-initdb.d/10-core.sh:ro
      - ./deploy/core-local/migrations:/opt/core-migrations:ro
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -q -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 40

  api:
    <<: *core-api
    environment:
      <<: *core-env
      DATABASE_URL: postgres://hs_core_probe:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      APP_ORIGIN: http://127.0.0.1:8080
      JWT_KEY_FILE: /e2e-secrets/jwt
      PROJECTS_WRITES_ENABLED: "true"
      ENROLLMENTS_WRITES_ENABLED: "true"
      CLOSURES_WRITES_ENABLED: "true"
      HOURS_WRITES_ENABLED: "true"
    volumes:
      - e2e-secrets:/e2e-secrets:ro

  api-missing:
    <<: *core-api
    environment:
      <<: *core-env
      DATABASE_URL: postgres://hs_core_probe:${POSTGRES_PASSWORD}@db:5432/postgres?sslmode=disable

  web:
    profiles: [tools]
    image: hs-web:${APP_VERSION:-0.0.1}-test-core
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
      target: runtime
      args: {APP_VERSION: "${APP_VERSION:-0.0.1}"}
    networks: [data]

  e2e-init:
    profiles: [tools]
    image: node:22.23.4-bookworm-slim
    network_mode: none
    volumes:
      - e2e-secrets:/e2e-secrets
      - ./tests/e2e/init.cjs:/init.cjs:ro
    command: [node, /init.cjs]

  e2e-admin:
    profiles: [tools]
    image: hs-admin:${APP_VERSION:-0.0.1}-test-core
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
      target: admin-runtime
    environment:
      DB_MAX_CONNS: "1"
      DATABASE_URL: postgres://hs_app:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    networks: [data]
    volumes:
      - e2e-secrets:/e2e-secrets:ro

  e2e:
    profiles: [tools]
    build: ./tests/e2e
    network_mode: "service:web"
    init: true
    shm_size: 256mb
    volumes:
      - e2e-secrets:/e2e-secrets:ro

  catalogo-test:
    profiles: [tools]
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
      target: dev
    networks: [data]
    environment:
      HS_TEST_CORE_CATALOG: "1"
      DATABASE_URL: postgres://hs_core_probe:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    command: [go, test, -count=1, -run, '^Test(CatalogoAcademico|CatalogoTerritorial|CoordinadorCarrera|Instituciones|InstitucionesAPI|EstudiantesAPI|ProyectosAPI|ParticipacionesAPI|CierresAPI|HorasAPI|ReportesAPI)PostgreSQL$', ./internal/platform/http, ./internal/modules/instituciones]

  probe:
    image: node:22.23.4-bookworm-slim
    profiles: [tools]
    networks: [data]
    volumes:
      - ./tests/check-core-readiness.cjs:/probe/check.cjs:ro
    entrypoint: [node, /probe/check.cjs]
    command: []

networks:
  data: {internal: true}
volumes:
  pgdata: {}
  e2e-secrets: {}
