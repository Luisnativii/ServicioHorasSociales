name: hs-dev

services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Ejecuta scripts/init-local.sh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecuta scripts/init-local.sh}
      POSTGRES_DB: ${POSTGRES_DB:?Ejecuta scripts/init-local.sh}
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s
  api:
    image: hs-api:${APP_VERSION:-0.0.1}-dev
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
      args: {APP_VERSION: "${APP_VERSION:-0.0.1}"}
      target: runtime
    environment:
      DATABASE_URL: postgres://${HS_APP_DB_USER:-${POSTGRES_USER}}:${HS_APP_DB_PASSWORD:-${POSTGRES_PASSWORD}}@db:5432/${POSTGRES_DB}?sslmode=disable
      DB_MAX_CONNS: ${DB_MAX_CONNS:-5}
    depends_on:
      db: {condition: service_healthy}
    networks: [app, data]
    healthcheck:
      test: [CMD, /api, healthcheck]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 30s
    stop_grace_period: 15s
  web:
    image: hs-web:${APP_VERSION:-0.0.1}-dev
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
      args: {APP_VERSION: "${APP_VERSION:-0.0.1}"}
      target: runtime
    depends_on:
      api: {condition: service_healthy}
    networks: [app]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/]
      interval: 5s
      timeout: 3s
      retries: 12
  migrator:
    image: hs-migrator:${APP_VERSION:-0.0.1}-dev
    build:
      context: .
      dockerfile: deploy/docker/migrator.Dockerfile
      args: {APP_VERSION: "${APP_VERSION:-0.0.1}"}
    profiles: [tools]
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://${HS_MIGRATOR_DB_USER:-${POSTGRES_USER}}:${HS_MIGRATOR_DB_PASSWORD:-${POSTGRES_PASSWORD}}@db:5432/${POSTGRES_DB}?sslmode=disable&connect_timeout=3
    depends_on:
      db: {condition: service_healthy}
    networks: [data]

networks:
  app: {}
  data: {internal: true}
volumes:
  pgdata: {}
