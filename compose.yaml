name: hs-dev

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "${HS_LOG_MAX_SIZE:-10m}"
    max-file: "${HS_LOG_MAX_FILES:-3}"

services:
  db:
    image: postgres:18.6-bookworm
    cpus: "${HS_DB_CPUS:-1.0}"
    mem_limit: "${HS_DB_MEMORY:-512m}"
    pids_limit: ${HS_DB_PIDS:-256}
    logging: *bounded-logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Ejecuta scripts/init-local.sh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecuta scripts/init-local.sh}
      POSTGRES_DB: ${POSTGRES_DB:?Ejecuta scripts/init-local.sh}
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s
  api:
    image: hs-api:${APP_VERSION:-0.0.1}-dev
    cpus: "${HS_API_CPUS:-2.0}"
    mem_limit: "${HS_API_MEMORY:-1g}"
    pids_limit: ${HS_API_PIDS:-512}
    logging: *bounded-logging
    restart: unless-stopped
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
      args: {APP_VERSION: "${APP_VERSION:-0.0.1}"}
      target: runtime
    environment:
      DATABASE_URL: postgres://${HS_APP_DB_USER:-${POSTGRES_USER}}:${HS_APP_DB_PASSWORD:-${POSTGRES_PASSWORD}}@db:5432/${POSTGRES_DB}?sslmode=disable
      DB_MAX_CONNS: ${DB_MAX_CONNS:-5}
      APP_ORIGIN: ${APP_ORIGIN:-}
    depends_on:
      db: {condition: service_healthy}
    networks: [app, data]
    healthcheck:
      test: [CMD, /api, healthcheck]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 30s
    stop_grace_period: 15s
  web:
    image: hs-web:${APP_VERSION:-0.0.1}-dev
    cpus: "${HS_WEB_CPUS:-1.0}"
    mem_limit: "${HS_WEB_MEMORY:-512m}"
    pids_limit: ${HS_WEB_PIDS:-256}
    logging: *bounded-logging
    restart: unless-stopped
    stop_grace_period: 15s
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
      args: {APP_VERSION: "${APP_VERSION:-0.0.1}"}
      target: runtime
    depends_on:
      api: {condition: service_healthy}
    networks: [app]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/]
      interval: 5s
      timeout: 3s
      retries: 12
  migrator:
    image: hs-migrator:${APP_VERSION:-0.0.1}-dev
    cpus: "${HS_MIGRATOR_CPUS:-0.5}"
    mem_limit: "${HS_MIGRATOR_MEMORY:-256m}"
    pids_limit: ${HS_MIGRATOR_PIDS:-128}
    logging: *bounded-logging
    restart: "no"
    stop_grace_period: 15s
    build:
      context: .
      dockerfile: deploy/docker/migrator.Dockerfile
      args: {APP_VERSION: "${APP_VERSION:-0.0.1}"}
    profiles: [tools]
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://${HS_MIGRATOR_DB_USER:-${POSTGRES_USER}}:${HS_MIGRATOR_DB_PASSWORD:-${POSTGRES_PASSWORD}}@db:5432/${POSTGRES_DB}?sslmode=disable&connect_timeout=3
    depends_on:
      db: {condition: service_healthy}
    networks: [data]

  admin:
    image: hs-admin:${APP_VERSION:-0.0.1}-dev
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
      args: {APP_VERSION: "${APP_VERSION:-0.0.1}"}
      target: admin-runtime
    profiles: [tools]
    environment:
      DATABASE_URL: postgres://${HS_APP_DB_USER:-${POSTGRES_USER}}:${HS_APP_DB_PASSWORD:-${POSTGRES_PASSWORD}}@db:5432/${POSTGRES_DB}?sslmode=disable
      DB_MAX_CONNS: '1'
    depends_on:
      db: {condition: service_healthy}
    networks: [data]
    cpus: '2.0'
    mem_limit: 256m
    pids_limit: 128
    logging: *bounded-logging
    restart: "no"
    read_only: true

networks:
  app: {}
  data: {internal: true}
volumes:
  pgdata: {}
